version: '3.8'

services:
  # Service API Node.js
  api:
    build: .
    ports:
      - "${PORT}:${PORT}"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=${PORT}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
    networks:
      - f1-network

  # Service MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      - f1-network

  # Service MongoDB Express (interface d'administration)
  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=${ME_CONFIG_MONGODB_SERVER}
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_CONFIG_BASICAUTH_USERNAME}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD}
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${ME_CONFIG_BASICAUTH_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - f1-network

volumes:
  mongodb_data:

networks:
  f1-network:
    driver: bridge