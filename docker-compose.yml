services:
  api:
    build:
      context: ./
      dockerfile: dockerfile
    restart: always
    ports:
      - "4002:4002"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - mongo

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
